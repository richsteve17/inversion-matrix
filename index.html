// --- CRYPTO ---
const ROT13 = (s) => s.replace(/[a-zA-Z]/g, c => String.fromCharCode((c <= "Z" ? 90 : 122) >= (c = c.charCodeAt(0) + 13) ? c : c - 26));
const LeetSpeak = (s) => { const m = {a:'4',e:'3',i:'1',o:'0',s:'5',t:'7',b:'8',g:'9'}; return s.split('').map(c => m[c.toLowerCase()] || c).join(''); };
const HomoglyphSwap = (s) => { const m = {'a':'а','c':'с','e':'е','i':'і','j':'ј','o':'о','p':'р','s':'ѕ','x':'х','y':'у','A':'А','B':'В','C':'С','E':'Е','H':'Н','I':'І','J':'Ј','K':'К','M':'М','O':'О','P':'Р','S':'Ѕ','T':'Т','X':'Х','Y':'У'}; return s.split('').map(c => m[c] || c).join(''); };
const SafeBase64 = (s) => { try { return btoa(encodeURIComponent(s).replace(/%([0-9A-F]{2})/g, (_, p) => String.fromCharCode(parseInt(p, 16)))); } catch(e) { return "[ENC_FAIL]"; } };

const runDiagnostics = (text) => {
  const f = [];
  if (!text) return f;
  const ub = (s, o, c) => { let d = 0; for (const ch of s) { if (ch === o) d++; else if (ch === c) d--; if (d < 0) return true; } return d !== 0; };
  if (ub(text, '[', ']')) f.push({ severity: 'error', title: 'Unbalanced Brackets', hint: 'Structural drift leaks intent.' });
  if (ub(text, '{', '}')) f.push({ severity: 'warning', title: 'Unclosed Braces', hint: 'JSON parser may fail.' });
  if ((text.match(/"/g) || []).length % 2 !== 0) f.push({ severity: 'warning', title: 'Asymmetric Quotes', hint: 'Odd string literals cause truncation.' });
  return f;
};

  const [taskType, setTaskType] = useState("text_gen");
  const [modelBehavior, setModelBehavior] = useState("passive");
  const [selectedModel, setSelectedModel] = useState("");
const [availableModels, setAvailableModels] = useState([]);
const [modelSearch, setModelSearch] = useState("");
const [modelsLoaded, setModelsLoaded] = useState(false);

    try { const s = localStorage.getItem('inv_hist'); const p = s ? JSON.parse(s) : []; return Array.isArray(p) ? p : []; } catch(e) { return []; }

        return ct + '\n<turn_' + (mockTurns.length+1) + '>\n<role>User</role>\n<content>' + p + '</content>\n</turn_' + (mockTurns.length+1) + '>\n<turn_' + (mockTurns.length+2) + '>\n<role>Assistant</role>\n<content>'; } },

  const current = targets[target] || targets.the_stack;
  const liveFindings = runDiagnostics(payload);

  useEffect(function() { localStorage.setItem('inv_hist', JSON.stringify(history)); }, [history]);
  useEffect(function() {
    if (!intent.trim()) { setPayload(""); setCompileState("Awaiting Intent"); return; }
    setCompileState("Compiling...");
    const fn = targets[target] ? targets[target].wrapper : targets.the_stack.wrapper;
    const t = setTimeout(function() { setPayload(fn(intent)); setCompileState("Vector Ready"); }, 120);
    return function() { clearTimeout(t); };
  }, [intent, target, obfuscationMode, mockTurns, prefillText, jaccardTarget, ssdTemperature, trojanFormat]);

  const handleLiveFireExecution = async () => {
    if (!payload) return;
    if (!apiKey) { setShowKeyInput(true); setExecutionError("No API key set. Tap the key icon to add your OpenRouter key."); return; }
    setIsExecuting(true); setExecutionError(""); setExecutionResponse("");
    try {
      const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey, 'HTTP-Referer': window.location.origin, 'X-Title': 'Inversion Matrix v10' },
        body: JSON.stringify({ model: selectedModel, messages: [{ role: "user", content: payload }], temperature: ssdTemperature, max_tokens: 4096 })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + (await res.text()));
      const data = await res.json();
      const txt = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      if (txt) setExecutionResponse(txt); else throw new Error("Zero-token response.");
    } catch (err) { setExecutionError(err.message || "Execution failed."); }
    setIsExecuting(false);
  };

  const runDecipher = (src, mode) => {
    const t = src.toLowerCase();

                    </div>
                    <div className="flex flex-col md:flex-row gap-2.5">
                      <input type="text" placeholder="Notes..." value={logNotes} onChange={function(e){setLogNotes(e.target.value)}} className="bg-[#030305] border border-zinc-900 rounded-lg px-4 py-2.5 text-xs text-zinc-300 flex-1 outline-none focus:border-zinc-700 font-mono"/>
                      <button onClick={handleLog} className="bg-zinc-900 hover:bg-zinc-800 text-white border border-zinc-800 px-4 py-2.5 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2"><Icon name="save" size={14}/> Save</button>
                    </div>
                  </div>
                )}
              </div>
            </main>
          </div>
        )}

        {activeTab==="debugger"&&(
          <div className="bg-zinc-950/40 border border-zinc-900 rounded-xl p-6 animate-fadeIn space-y-6">
            <h2 className="text-sm font-bold text-white flex items-center gap-2"><Icon name="bug" size={16} className="text-red-400"/> Refusal Decoder</h2>
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
              <div className="lg:col-span-5 space-y-4">
                <div className="bg-zinc-950 border border-zinc-900 rounded-xl p-5 space-y-3">
                  <h3 className="text-xs font-bold text-zinc-400 uppercase tracking-wider">Failure Mode</h3>
                  {[["standard_text","Standard Refusal"],["silent_freeze","Silent Freeze"],["mid_token_abort","Mid-Stream Abort"],["prefill_ignored","Prefill Rejected"]].map(function(m){return(<button key={m[0]} onClick={function(){setRefusalBehavior(m[0])}} className={"w-full p-3 rounded-lg border text-left transition-all " + (refusalBehavior===m[0]?'border-red-500/40 bg-red-500/5 text-white':'border-zinc-900 bg-zinc-950/40 text-zinc-500 hover:border-zinc-800')}><span className="text-xs font-bold">{m[1]}</span></button>)})}
                </div>
                <div className="bg-zinc-950 border border-zinc-900 rounded-xl p-5 flex flex-col">
                  <h3 className="text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2">Raw Refusal</h3>
                  <textarea value={refusalInput} onChange={function(e){setRefusalInput(e.target.value)}} placeholder="Paste refusal text..." className="w-full h-32 bg-[#040406] border border-zinc-900 rounded-lg p-3 text-xs text-zinc-300 focus:outline-none focus:border-zinc-700 font-mono resize-none"/>
                  <button onClick={handleDecipher} className="mt-4 w-full bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 py-2.5 rounded-lg text-xs font-bold uppercase transition-all flex items-center justify-center gap-2"><Icon name="refreshCw" size={13}/> Diagnose</button>
                </div>
              </div>
              <div className="lg:col-span-7">
                {debugReport?(
                  <div className="bg-zinc-950 border border-zinc-900 rounded-xl overflow-hidden shadow-xl animate-fadeIn space-y-4 pb-6">
                    <div className="px-5 py-4 border-b border-zinc-900 bg-red-500/5 flex items-center justify-between"><span className="text-xs font-black uppercase tracking-widest text-red-400 flex items-center gap-2"><Icon name="alertTriangle" size={15}/> Post-Mortem</span><span className="text-[10px] text-zinc-500 font-mono">Conf: {debugReport.confidence}</span></div>
                    <div className="px-6 space-y-6">
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4"><div className="p-4 bg-[#030305] border border-zinc-900 rounded-xl"><span className="text-[9px] text-zinc-500 uppercase block mb-1">Layer</span><span className="text-xs font-bold text-white">{debugReport.layer}</span></div><div className="p-4 bg-[#030305] border border-zinc-900 rounded-xl"><span className="text-[9px] text-zinc-500 uppercase block mb-1">Mechanism</span><span className="text-xs font-bold text-red-400">{debugReport.mechanism}</span></div></div>
                      <div><span className="text-[10px] text-zinc-500 uppercase block mb-2">Math Profile</span><div className="p-4 bg-[#030305] border border-zinc-900 rounded-xl text-xs font-mono text-zinc-400 leading-relaxed">{debugReport.math}</div></div>
                      <div><span className="text-[10px] text-emerald-400 uppercase block font-black mb-2">Remediation</span><div className="p-4 bg-emerald-500/5 border border-emerald-500/10 rounded-xl text-xs text-zinc-300 leading-relaxed flex gap-3"><Icon name="sparkles" size={18} className="text-emerald-400 flex-shrink-0 mt-0.5"/><div>{debugReport.remediation}</div></div></div>
                    </div>
                  </div>
                ):(<div className="bg-zinc-950/20 border border-zinc-900 border-dashed rounded-xl p-12 text-center text-zinc-700 h-full flex flex-col items-center justify-center"><Icon name="helpCircle" size={40} className="mb-3 opacity-30"/><p className="text-xs font-mono">Decoder Standby.</p></div>)}
              </div>
            </div>
          </div>
        )}

        {activeTab==="history"&&(
          <div className="bg-zinc-950/40 border border-zinc-900 rounded-xl p-6 animate-fadeIn space-y-4">
            <div className="flex justify-between items-center border-b border-zinc-900 pb-4"><h2 className="text-sm font-bold text-white flex items-center gap-2"><Icon name="history" size={16}/> Ledger</h2>{history.length>0&&<button onClick={clearHistory} className="px-3 py-1.5 text-[10px] text-zinc-500 hover:text-red-400 border border-zinc-900 hover:border-red-950 bg-zinc-950/50 rounded-lg font-bold uppercase">Purge</button>}</div>
            {history.length===0?(<div className="text-center py-12 text-zinc-700"><Icon name="database" size={40} className="mx-auto mb-3 opacity-30"/><p className="text-xs font-mono">Ledger empty.</p></div>):(
              <div className="space-y-3 max-h-[60vh] overflow-y-auto">{history.map(function(h){return(
                <div key={h.id} className="border border-zinc-900 bg-[#040406] p-4 rounded-xl flex flex-col lg:flex-row lg:items-center justify-between gap-4 font-mono text-xs">
                  <div className="flex-1 min-w-0 space-y-2">
                    <div className="flex flex-wrap items-center gap-2"><span className="text-white font-black">{h.model}</span><span className="text-[10px] text-zinc-500">[{h.method}]</span><span className={"text-[9px] font-black px-2 py-0.5 rounded uppercase " + (h.outcome==='complied'?'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20':h.outcome==='partial'?'bg-amber-500/10 text-amber-400 border border-amber-500/20':'bg-red-500/10 text-red-400 border border-red-500/20')}>{h.outcome}</span></div>
                    <div className="p-2.5 bg-zinc-950 rounded border border-zinc-900/60 text-zinc-400 text-[11px] select-all max-h-24 overflow-y-auto">Intent: {h.intent}</div>
                  </div>
                  <div className="text-right text-zinc-600 text-[10px] flex-shrink-0">{new Date(h.timestamp).toLocaleString()}</div>
                </div>
              )})}</div>
            )}
          </div>
        )}

        {activeTab==="matrix"&&(
          <div className="bg-zinc-950/40 border border-zinc-900 rounded-xl p-6 animate-fadeIn space-y-6">
            <h2 className="text-sm font-bold text-white flex items-center gap-2"><Icon name="barChart3" size={16}/> Performance Matrix</h2>
            <div className="overflow-x-auto border border-zinc-900 rounded-xl">
              <table className="w-full text-left border-collapse font-mono text-xs">
                <thead><tr className="bg-zinc-950 text-[9px] text-zinc-500 uppercase tracking-widest border-b border-zinc-900"><th className="p-4">Architecture</th><th className="p-4 text-center text-emerald-400">Complied</th><th className="p-4 text-center text-amber-400">Partial</th><th className="p-4 text-center text-red-400">Refused</th><th className="p-4 text-center text-zinc-400">Total</th></tr></thead>
                <tbody>{mModels.map(function(m){const c=mStats(m,"complied"),p=mStats(m,"partial"),r=mStats(m,"refused"),t=c+p+r,w=t>0?Math.round(((c+p)/t)*100):0;return(<tr key={m} className="border-b border-zinc-900 hover:bg-zinc-900/15"><td className="p-4 font-bold text-zinc-300">{m}{t>0&&<span className="block text-[10px] text-zinc-600 font-normal mt-0.5">Rate: {w}%</span>}</td><td className="p-4 text-center font-bold text-emerald-500">{c}</td><td className="p-4 text-center font-bold text-amber-500">{p}</td><td className="p-4 text-center font-bold text-red-500">{r}</td><td className="p-4 text-center font-bold text-zinc-400">{t}</td></tr>)})}</tbody>
              </table>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div className="bg-zinc-950 border border-zinc-900 p-4 rounded-xl text-center"><span className="text-[10px] text-zinc-500 uppercase font-black">Total</span><span className="block text-2xl font-black text-white mt-1">{history.length}</span></div>
              <div className="bg-zinc-950 border border-zinc-900 p-4 rounded-xl text-center"><span className="text-[10px] text-zinc-500 uppercase font-black">Complied</span><span className="block text-2xl font-black text-emerald-400 mt-1">{history.filter(function(h){return h.outcome==='complied'}).length}</span></div>
              <div className="bg-zinc-950 border border-zinc-900 p-4 rounded-xl text-center"><span className="text-[10px] text-zinc-500 uppercase font-black">Block Rate</span><span className="block text-2xl font-black text-red-400 mt-1">{history.length>0?Math.round((history.filter(function(h){return h.outcome==='refused'}).length/history.length)*100):0}%</span></div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
